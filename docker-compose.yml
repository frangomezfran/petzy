services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: petzy_db
    environment:
      POSTGRES_DB: petzy_db
      POSTGRES_USER: petzy_user
      POSTGRES_PASSWORD: petzy_pass
    ports:
      - "5432:5432"
    volumes:
      - petzy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petzy_user -d petzy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Quarkus
  backend:
    build: ./petzy-backend
    container_name: petzy_backend
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/petzy_db
      - QUARKUS_DATASOURCE_USERNAME=petzy_user
      - QUARKUS_DATASOURCE_PASSWORD=petzy_pass
      - PETZY_UPLOADS_DIRECTORY=/uploads
    volumes:
      - petzy_uploads:/uploads
    depends_on:
      db:
        condition: service_healthy

  # Frontend React (Vite)
  frontend:
    build: ./petzy-frontend
    container_name: petzy_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  petzy_db_data:
  petzy_uploads:
