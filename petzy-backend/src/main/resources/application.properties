# Configuración de base de datos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=petzy_user
quarkus.datasource.password=petzy_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/petzy_db

# Hibernar ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Seguridad JWT
mp.jwt.verify.issuer=https://petzy.com/issuer
smallrye.jwt.sign.key.location=keys/privateKey.pem

# CORS (Configuración permisiva para desarrollo)
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Access-Control-Allow-Origin
quarkus.http.cors.exposed-headers=Content-Disposition

# Almacenamiento local
petzy.uploads.directory=/uploads

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/swagger
